<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>OTP নাম্বার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070f1d; --bg2:#0c1a31; --card:rgba(18,32,54,.66); --card2:rgba(30,48,76,.8); --line:rgba(120,160,220,.18);
  --text:#f1f5fc; --muted:#8ea5c7; --accent:#4d83ff; --accent2:#8a5cff; --accent3:#22d3ee; --on-accent:#fff;
  --ok:#35d49a; --warn:#ffb84d; --err:#ff7a85; --glow:rgba(77,131,255,.38);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#edf2fa; --bg2:#dfe8f7; --card:rgba(255,255,255,.82); --card2:rgba(232,239,250,.95); --line:rgba(36,87,255,.14);
    --text:#14233a; --muted:#5a7092; --accent:#2457ff; --accent2:#6a45ff; --accent3:#0aa6c2; --on-accent:#fff;
    --ok:#0c8f61; --warn:#a86300; --err:#c92f45; --glow:rgba(36,87,255,.25);
    color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;color:var(--text);background:linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;
  font-family:"Hind Siliguri",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora i{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(70px);opacity:.38;animation:drift 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--accent);top:-90px;left:-60px}
.aurora i:nth-child(2){background:var(--accent2);top:120px;right:-110px;animation-delay:-5s}
.aurora i:nth-child(3){background:var(--accent3);bottom:-100px;left:20%;opacity:.25;animation-delay:-9s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:6px 14px 44px}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 8px}
header{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;
  padding:8px 14px;margin:0 -14px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(180deg,var(--bg) 40%,transparent)}
h1{font-size:18.5px;margin:0;font-weight:700;line-height:1.15;letter-spacing:.01em}
.sub{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;margin-top:2px}
.sub::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{position:relative;width:46px;height:46px;border-radius:50%;flex:none;padding:2.5px;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent3),var(--accent));animation:spinring 6s linear infinite;
  box-shadow:0 0 18px var(--glow)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:var(--card2);animation:spinring 6s linear infinite reverse;border:2px solid var(--bg)}
@keyframes spinring{to{transform:rotate(360deg)}}
.hbtns{display:flex;gap:6px}
.hbtns .icon{padding:8px 12px;font-size:15px;border-radius:12px;min-width:38px}
h2{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05);animation:rise .4s ease both}
.card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{position:relative;overflow:hidden;font:inherit;cursor:pointer;border:none;border-radius:14px;padding:13px 14px;font-weight:600;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent),var(--accent2));width:100%;box-shadow:0 6px 18px var(--glow);transition:transform .12s ease,opacity .15s}
button:not(.ghost):not(.x):not(.icon)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none}
button.icon{width:auto;padding:8px 12px;font-size:13px}
input{font:inherit;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:12px 13px;border-radius:13px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);outline:none}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.chips{display:flex;gap:8px;margin:0 -16px 12px;padding:2px 16px 6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .empty{white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:7px 8px 7px 15px;font-weight:600;cursor:pointer;transition:all .18s}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--on-accent);box-shadow:0 4px 14px var(--glow);transform:translateY(-1px)}
.chip .x{background:none;border:none;box-shadow:none;color:inherit;opacity:.65;width:auto;padding:0 5px;font-size:17px;line-height:1}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1}.addrow button{width:auto}
#current{border-color:rgba(77,131,255,.35);background:linear-gradient(160deg,rgba(77,131,255,.14),var(--card) 55%)}
.number{font-size:29px;font-weight:700;letter-spacing:.03em;margin:4px 0;word-break:break-all;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--text),var(--accent3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
#current.waiting .timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--err);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.2;transform:scale(.7)}}
.track{height:5px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));transition:width .5s linear}
.otp{display:flex;gap:8px;margin:14px 0 10px;justify-content:center;cursor:pointer}
.otp span{flex:1;max-width:56px;text-align:center;font-size:31px;font-weight:700;padding:11px 0;background:var(--card2);
  border:1.5px solid var(--ok);color:var(--ok);border-radius:14px;box-shadow:0 0 18px rgba(53,212,154,.28);
  animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.otp span:nth-child(2){animation-delay:.05s}.otp span:nth-child(3){animation-delay:.1s}.otp span:nth-child(4){animation-delay:.15s}
.otp span:nth-child(5){animation-delay:.2s}.otp span:nth-child(6){animation-delay:.25s}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
.status{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.warn{color:var(--warn)}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .9s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.card,.otp span,.logo,.logo img,.aurora i,button::after{animation:none!important}}
.btns{display:flex;gap:8px;margin-top:12px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.hist li:active{opacity:.6}.hist li:first-child{border-top:none}
.hl{display:flex;align-items:center;gap:11px;min-width:0}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
.hist b{font-size:15px}
.hist .otpv{color:var(--ok);font-weight:700;font-size:17px;letter-spacing:.08em}
.empty{color:var(--muted);font-size:13.5px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:9;background:var(--text);color:var(--bg);
  padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .22s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="grab"></div>
  <header>
    <div class="brand">
      <div class="logo"><img id="logo" src="https://i.postimg.cc/qgCPCKB3/IMG-20261029-221418-464.jpg" alt="লোগো"
        onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='logo.png'}else{this.parentNode.style.display='none'}"></div>
      <div><h1>OTP নাম্বার</h1><div class="sub">নাম্বার নিন · OTP পান</div></div>
    </div>
    <div class="hbtns">
      <button class="ghost icon" id="btnMin" hidden aria-label="ছোট করুন">—</button>
      <button class="ghost icon" id="btnSettings" aria-expanded="false" aria-label="সেটিংস">⚙</button>
      <button class="ghost icon" id="btnClose" aria-label="বন্ধ করুন">✕</button>
    </div>
  </header>

  <section class="card" id="settings" hidden>
    <label for="base">সার্ভারের ঠিকানা (Base URL)</label>
    <input id="base" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="key">API Key</label>
    <input id="key" placeholder="ps_..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="btnSave" style="margin-top:14px">সেভ করুন</button>
    <p class="meta" style="margin:10px 0 0">তথ্য শুধু এই ফোনে জমা থাকে। শুধু আপনার সার্ভারে রিকোয়েস্ট যায়।</p>
  </section>

  <section class="card">
    <h2>রেঞ্জ বাছুন</h2>
    <div class="chips" id="chips"></div>
    <div class="addrow">
      <input id="newRid" inputmode="numeric" placeholder="নতুন রেঞ্জ, যেমন 26134">
      <button class="ghost" id="btnAdd">যোগ করুন</button>
    </div>
    <button id="btnGet">নাম্বার নিন</button>
  </section>

  <section class="card" id="current" hidden>
    <div class="row"><div class="meta" id="cMeta"></div><div class="timer" id="timer"></div></div>
    <div class="row">
      <div class="number" id="cNum"></div>
      <button class="ghost icon" id="cCopy">কপি</button>
    </div>
    <div id="cOtpBox"></div>
    <div class="status" id="cStatus"></div>
    <div class="track" id="track" hidden><i id="bar"></i></div>
    <div class="btns" id="cBtns"></div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">আগের নাম্বার</h2>
      <button class="ghost icon" id="btnClear">মুছুন</button>
    </div>
    <ul class="hist" id="hist"></ul>
  </section>
</div>
<div id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let cfg = store.get('cfg', { base: 'https://min-bot-emf8.onrender.com/api/v1', key: '' });
let ranges = store.get('ranges', ['26134']);
let activeRid = store.get('activeRid', ranges[0] || '');
let history = store.get('history', []);
let current = null;
let pollId = 0;

const WAIT_SECONDS = 25;
const MAX_MINUTES = 10;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch(_){} ta.remove();
  }
  try { navigator.vibrate && navigator.vibrate(30); } catch(e){}
  toast('কপি হয়েছে');
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function cleanBase(v){
  v = (v || '').trim().replace(/\/+$/, '');
  if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  if (!/\/api\/v1$/i.test(v)) v += '/api/v1';
  return v;
}

async function api(path, opts){
  const base = cleanBase(cfg.base);
  if (!base) return { fail: 'সেটিংসে সার্ভারের ঠিকানা দিন' };
  if (!cfg.key) return { fail: 'সেটিংসে API Key দিন' };
  const headers = Object.assign({ mauthapi: cfg.key }, (opts && opts.headers) || {});
  try {
    const res = await fetch(base + path, Object.assign({}, opts, { headers }));
    const text = await res.text();
    try { return { json: JSON.parse(text) }; }
    catch(e){ return { fail: 'সার্ভার থেকে সঠিক উত্তর আসেনি (HTTP ' + res.status + ')' }; }
  } catch(e){
    return { fail: 'নেটওয়ার্ক সমস্যা। সার্ভার ঘুমিয়ে থাকলে ৩০-৫০ সেকেন্ড পর আবার চেষ্টা করুন।' };
  }
}

/* ---------- settings ---------- */
$('btnSettings').onclick = () => {
  const s = $('settings'); s.hidden = !s.hidden;
  $('btnSettings').setAttribute('aria-expanded', String(!s.hidden));
};
$('btnSave').onclick = () => {
  cfg = { base: $('base').value.trim(), key: $('key').value.trim() };
  store.set('cfg', cfg);
  $('settings').hidden = true;
  toast('সেভ হয়েছে');
};
$('base').value = cfg.base; $('key').value = cfg.key;
if (!cfg.key) $('settings').hidden = false;

/* ---------- ranges ---------- */
function renderRanges(){
  $('chips').innerHTML = '';
  if (!ranges.length){ $('chips').innerHTML = '<p class="empty">একটা রেঞ্জ যোগ করুন</p>'; return; }
  ranges.forEach(r => {
    const c = document.createElement('div');
    c.className = 'chip'; c.tabIndex = 0; c.setAttribute('role', 'button');
    c.setAttribute('aria-pressed', String(r === activeRid));
    c.innerHTML = esc(r) + '<button class="x" aria-label="' + esc(r) + ' মুছুন">×</button>';
    c.onclick = () => { activeRid = r; store.set('activeRid', r); renderRanges(); };
    c.onkeydown = e => { if (e.key === 'Enter') c.click(); };
    c.querySelector('.x').onclick = e => {
      e.stopPropagation();
      ranges = ranges.filter(x => x !== r);
      if (activeRid === r) activeRid = ranges[0] || '';
      store.set('ranges', ranges); store.set('activeRid', activeRid); renderRanges();
    };
    $('chips').appendChild(c);
  });
}
$('btnAdd').onclick = () => {
  const v = $('newRid').value.trim();
  if (!v) return;
  if (!ranges.includes(v)) ranges.push(v);
  activeRid = v; $('newRid').value = '';
  store.set('ranges', ranges); store.set('activeRid', activeRid); renderRanges();
};

/* ---------- history ---------- */
function renderHistory(){
  const ul = $('hist');
  if (!history.length){ ul.innerHTML = '<p class="empty">এখনো কোনো নাম্বার নেওয়া হয়নি।</p>'; return; }
  ul.innerHTML = '';
  history.forEach(h => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="hl"><div class="av">' + esc((h.service || '#').charAt(0).toUpperCase()) + '</div><div><b>' + esc(h.full) + '</b><div class="meta">' + esc(h.time) + (h.service ? ' · ' + esc(h.service) : '') + '</div></div></div>' +
      '<div style="text-align:right">' + (h.otp ? '<div class="otpv">' + esc(h.otp) + '</div>' : '<div class="meta">OTP আসেনি</div>') + '</div>';
    li.style.cursor = 'pointer';
    li.onclick = () => copy(h.otp || h.full);
    ul.appendChild(li);
  });
}
$('btnClear').onclick = () => {
  if (!history.length) return;
  if (confirm('আগের সব নাম্বারের তালিকা মুছে ফেলবেন?')){ history = []; store.set('history', history); renderHistory(); }
};
function saveHistory(){
  if (!current) return;
  const i = history.findIndex(h => h.id === current.id);
  const item = { id: current.id, full: current.full, otp: current.otp || '', service: current.service || '', time: current.time };
  if (i >= 0) history[i] = item; else history.unshift(item);
  history = history.slice(0, 30);
  store.set('history', history); renderHistory();
}

/* ---------- current number card ---------- */
function setStatus(kind, text, spin){
  const s = $('cStatus'); s.className = 'status ' + (kind || '');
  s.innerHTML = (spin ? '<div class="spin"></div>' : '') + '<span>' + esc(text) + '</span>';
}
function setButtons(list){
  const b = $('cBtns'); b.innerHTML = '';
  list.forEach(x => {
    const el = document.createElement('button');
    el.textContent = x.label; if (x.ghost) el.className = 'ghost';
    el.onclick = x.fn; b.appendChild(el);
  });
}
let tickT = 0;
const pad = n => String(Math.floor(n)).padStart(2, '0');
function startTick(id){
  clearInterval(tickT);
  const t0 = Date.now(), bar = $('bar'), tm = $('timer');
  $('track').hidden = false; bar.style.width = '0'; $('current').classList.add('waiting');
  tickT = setInterval(() => {
    if (id !== pollId){ clearInterval(tickT); return; }
    const sec = (Date.now() - t0) / 1000;
    tm.textContent = pad(sec / 60) + ':' + pad(sec % 60);
    bar.style.width = Math.min(100, sec / (MAX_MINUTES * 60) * 100) + '%';
  }, 500);
}
function stopTick(){ clearInterval(tickT); $('track').hidden = true; $('current').classList.remove('waiting'); }
function showOtp(otp){
  $('cOtpBox').innerHTML = '<div class="otp">' + String(otp).split('').map(d => '<span>' + esc(d) + '</span>').join('') + '</div>';
}

async function poll(){
  const id = ++pollId, num = current.number;
  const deadline = Date.now() + MAX_MINUTES * 60000;
  let errs = 0;
  $('cOtpBox').innerHTML = '';
  setStatus('', 'OTP-র জন্য অপেক্ষা করা হচ্ছে...', true);
  startTick(id);
  setButtons([{ label: 'অপেক্ষা বন্ধ করুন', ghost: true, fn: () => { pollId++; stopped(); } }]);

  while (id === pollId){
    if (Date.now() > deadline){ return finish('warn', MAX_MINUTES + ' মিনিটে OTP আসেনি'); }
    const t0 = Date.now();
    const r = await api('/otp?number=' + encodeURIComponent(num) + '&wait=' + WAIT_SECONDS);
    if (id !== pollId) return;
    if (r.fail){
      if (++errs >= 3) return finish('err', r.fail);
      await sleep(3000); continue;
    }
    const j = r.json;
    if (j.meta && j.meta.code === 200 && j.data){
      current.otp = j.data.otp; current.service = j.data.service || '';
      stopTick(); saveHistory(); showOtp(current.otp); notifyHost('otp', current.otp);
      try { navigator.vibrate && navigator.vibrate(250); } catch(e){}
      setStatus('ok', 'OTP এসেছে' + (current.service ? ' (' + current.service + ')' : ''));
      setButtons([
        { label: 'OTP কপি করুন', fn: () => copy(current.otp) },
        { label: 'নতুন নাম্বার', ghost: true, fn: getNumber }
      ]);
      return;
    }
    if (j.meta && j.meta.code === 404) return finish('err', 'নাম্বারের মেয়াদ শেষ বা পাওয়া যায়নি');
    if (j.meta && j.meta.status === 'waiting'){
      if (Date.now() - t0 < 2000) await sleep(1500);
      continue;
    }
    if (++errs >= 3) return finish('err', 'অপ্রত্যাশিত উত্তর: ' + JSON.stringify(j).slice(0, 120));
    await sleep(2000);
  }
}
function finish(kind, text){
  stopTick(); setStatus(kind, text);
  setButtons([
    { label: 'আবার অপেক্ষা করুন', fn: poll },
    { label: 'নতুন নাম্বার', ghost: true, fn: getNumber }
  ]);
}
function stopped(){
  stopTick(); setStatus('warn', 'অপেক্ষা বন্ধ করা হয়েছে');
  setButtons([
    { label: 'আবার অপেক্ষা করুন', fn: poll },
    { label: 'নতুন নাম্বার', ghost: true, fn: getNumber }
  ]);
}

async function getNumber(){
  if (!activeRid){ toast('আগে একটা রেঞ্জ বাছুন'); return; }
  pollId++; stopTick(); $('timer').textContent = '';
  $('btnGet').disabled = true;
  $('current').hidden = false;
  $('cMeta').textContent = 'রেঞ্জ ' + activeRid;
  $('cNum').textContent = '...'; $('cOtpBox').innerHTML = ''; $('cBtns').innerHTML = '';
  setStatus('', 'নাম্বার আনা হচ্ছে...', true);
  const r = await api('/getnum', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rid: activeRid }) });
  $('btnGet').disabled = false;
  const retry = [{ label: 'আবার চেষ্টা করুন', fn: getNumber }];
  if (r.fail){ $('cNum').textContent = '-'; setStatus('err', r.fail); setButtons(retry); return; }
  const j = r.json, code = j.meta && j.meta.code;
  if (code === 200 && j.data){
    const full = j.data.full_number || ('+' + j.data.no_plus_number);
    current = {
      id: Date.now(), full, rid: activeRid,
      number: j.data.no_plus_number || (j.data.full_number || '').replace('+', ''),
      time: new Date().toLocaleString('bn-BD', { hour: 'numeric', minute: '2-digit', day: 'numeric', month: 'short' })
    };
    $('cNum').textContent = full;
    $('cMeta').textContent = 'রেঞ্জ ' + activeRid + (j.data.country ? ' · ' + j.data.country : '');
    saveHistory();
    notifyHost('number', current.number, current.full);
    poll();
  } else {
    $('cNum').textContent = '-';
    if (code === 2946) setStatus('warn', 'এই রেঞ্জে এখন নাম্বার নেই। অন্য রেঞ্জ বা একটু পরে চেষ্টা করুন।');
    else if (code === 401) setStatus('err', 'API Key ভুল। সেটিংসে ঠিক করুন।');
    else setStatus('err', 'সমস্যা: ' + JSON.stringify(j).slice(0, 140));
    setButtons(retry);
  }
}

$('btnGet').onclick = getNumber;
$('cCopy').onclick = () => current && copy(current.full);

/* হোস্ট অ্যাপে নাম্বার/OTP পাঠায়: Android WebView বা ওয়েবপেজের iframe */
function notifyHost(type, a, b){
  try {
    if (window.Android){
      if (type === 'number' && window.Android.onNumber) window.Android.onNumber(a, b || a);
      if (type === 'otp' && window.Android.onOtp) window.Android.onOtp(a);
    } else if (window.parent !== window){
      window.parent.postMessage({ type: 'otp-' + type, value: a, full: b }, '*');
    }
  } catch(e){}
}
function closePopup(){
  if (window.Android && window.Android.close) window.Android.close();
  else if (window.parent !== window) window.parent.postMessage('otp-close', '*');
  else window.close();
}
$('btnClose').onclick = closePopup;

$('btnMin').onclick = () => { if (window.Android && window.Android.minimize) window.Android.minimize(); };
if (window.Android){
  const g = document.querySelector('.grab'); if (g) g.style.display = 'none';
  if (window.Android.minimize) $('btnMin').hidden = false;
  const isIn = el => el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
  document.addEventListener('focusin', e => { if (isIn(e.target) && window.Android.setFocusable) window.Android.setFocusable(true); });
  document.addEventListener('focusout', () => setTimeout(() => {
    if (!isIn(document.activeElement) && window.Android.setFocusable) window.Android.setFocusable(false);
  }, 250));
}
renderRanges(); renderHistory();
</script>
